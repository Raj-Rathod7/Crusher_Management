services:
  mysql:
    image: mysql:8.0
    container_name: crusher-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crusher}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crusher-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/crusher
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-ChangeThisJwtSecretKeyForProductionMustBeLongEnough123456}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: crusher-client
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mysql_data: