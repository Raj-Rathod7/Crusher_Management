services:
  mysql:
    image: mysql:8.0
    container_name: crusher-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crusher}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s

  # Automated Cron Backup Service
  db-backup:
    image: fradelg/mysql-cron-backup:latest
    container_name: crusher-db-backup
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASS=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-crusher}
      - CRON_TIME=0 0 * * *        # Runs every night at midnight (Cron syntax)
      - MAX_BACKUPS=14             # Keeps the last 14 backups (deletes older ones)
      - INIT_BACKUP=1              # Set to 1 to take a backup immediately on startup
      - GZIP_LEVEL=9               # Maximum compression level
    volumes:
      # Mounts the container output directly to a 'backups' directory on your host machine
      - ./backups:/backup

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crusher-app
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-crusher}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DDL_AUTO: ${DDL_AUTO:-update}
      SERVER_PORT: ${SERVER_PORT:-8081}
      JWT_SECRET: ${JWT_SECRET:-ChangeThisJwtSecretKeyForProductionMustBeLongEnough123456}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${SERVER_PORT:-8081}/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: crusher-client
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mysql_data: