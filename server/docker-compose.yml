version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: crusher-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crusher
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  crusher-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crusher-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/crusher
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
      JWT_SECRET: ChangeThisJwtSecretKeyForProductionMustBeLongEnough123456
      JWT_EXPIRATION: 86400000
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
